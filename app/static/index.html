<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>串联稀释配液计算器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>串联稀释配液计算器</h1>
    <p>从末管向前回推制备量（计入后管取液），逐级算出前管取液量与稀释液量；Decimal 高精度计算，可行性按未取整值判定。</p>
  </header>

  <main>
    <section class="card">
      <h2>参数</h2>
      <div class="grid">
        <label>母液浓度
          <input id="stockConc" type="text" inputmode="decimal" value="100">
        </label>
        <label>移液下限（体积）
          <input id="pipetteMin" type="text" inputmode="decimal" value="2">
        </label>
        <label>浓度单位（仅显示）
          <input id="concUnit" type="text" value="mg/mL">
        </label>
        <label>体积单位（仅显示）
          <input id="volUnit" type="text" value="µL">
        </label>
      </div>

      <h3>目标管（浓度须逐级递减）</h3>
      <table id="tubeTable">
        <thead>
          <tr><th>#</th><th>目标浓度</th><th>保留体积</th><th>预留损耗</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="actions">
        <button id="addTube" type="button">＋ 添加目标管</button>
        <button id="fillExample" type="button">填入可行示例</button>
        <button id="fillBadExample" type="button">填入不可行示例</button>
        <button id="calc" type="button" class="primary">计 算</button>
      </div>
      <p id="formError" class="error" hidden></p>
    </section>

    <section id="results" hidden>
      <div class="card" id="summaryCard"></div>
      <div class="card">
        <h2>逐管步骤</h2>
        <p class="hint">显示值已取整到 0.001；可行性判断使用未取整的精确值。</p>
        <div class="table-wrap">
          <table id="stepTable">
            <thead>
              <tr>
                <th>管号</th><th>目标浓度</th><th>制备总量</th><th>取液来源</th>
                <th>取液量</th><th>稀释液量</th><th>保留体积</th><th>预留损耗</th><th>状态</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <ol id="stepNarrative" class="narrative"></ol>
      </div>
    </section>
  </main>

  <footer>
    <p>FastAPI · Decimal · 原生 JS</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
